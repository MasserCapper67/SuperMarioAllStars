# Online play builds: the Windows exe (zipped with its files) and the Linux
# AppImage, from the online-play branch (or run by hand from the Actions tab).
# Each is uploaded as the run's artifact; nothing is released. No game data
# is involved: the ROM stays with each player.
name: Online Play Builds

on:
  push:
    branches: [online-play]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --target SuperMarioAllStars

      - name: Package
        shell: pwsh
        run: |
          $out = "SuperMarioAllStars-Windows"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse build/Release/* $out
          Get-ChildItem $out -Include *.pdb,*.ilk,*.exp,*.lib -Recurse | Remove-Item
          Get-ChildItem $out

      - uses: actions/upload-artifact@v4
        with:
          name: SuperMarioAllStars-Windows
          path: SuperMarioAllStars-Windows

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang pkg-config file \
            libfreetype-dev libgles-dev libegl-dev libgl-dev fonts-dejavu-core \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev

      - name: SDL2 2.32.10
        run: |
          curl -fsSL -o sdl.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
          tar xf sdl.tar.gz
          cmake -S SDL2-2.32.10 -B sdlbuild -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/sdl2 \
            -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build sdlbuild
          sudo cmake --install sdlbuild

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/sdl2 \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build

      - name: AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp third_party/fonts/LuckiestGuy-Regular.ttf AppDir/usr/bin/
          cp third_party/fonts/LICENSE.txt AppDir/usr/bin/LuckiestGuy-LICENSE.txt
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf AppDir/usr/bin/
          cp /usr/share/doc/fonts-dejavu-core/copyright AppDir/usr/bin/DejaVu-LICENSE.txt
          cp release/README.txt AppDir/usr/bin/
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          export APPIMAGE_EXTRACT_AND_RUN=1 LD_LIBRARY_PATH=/opt/sdl2/lib OUTPUT=SuperMarioAllStars-Linux-x86_64.AppImage
          ./linuxdeploy --appdir AppDir --executable build/SuperMarioAllStars \
            --desktop-file packaging/linux/supermarioallstars.desktop \
            --icon-file packaging/linux/supermarioallstars.png --exclude-library "libGLESv2*" --output appimage
          ls -la *.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: SuperMarioAllStars-Linux-x86_64
          path: SuperMarioAllStars-Linux-x86_64.AppImage
